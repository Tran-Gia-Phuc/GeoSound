{{- /*
Redis (deployment plan task 2.3, issue #371): rate limits, session revocations, presence, job
locks (task 0.8). One StatefulSet with AOF on a PVC, like docker-compose.prod.yml.
The password is optional: REDIS_PASSWORD in .Values.redis.secret turns on requirepass, and then
REDIS_URL in geosound-infra must carry it (redis://:<password>@redis:6379).
*/ -}}
{{- with .Values.redis }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "geosound.labels" $ | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  selector:
    {{- include "geosound.selector" (dict "root" $ "name" "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
    {{- if .exporter.enabled }}
    - { name: metrics, port: 9121, targetPort: metrics }
    {{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "geosound.labels" $ | nindent 4 }}
    app.kubernetes.io/name: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "geosound.selector" (dict "root" $ "name" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geosound.labels" $ | nindent 8 }}
        app.kubernetes.io/name: redis
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999 # redis in the alpine image
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .image }}
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - exec redis-server --appendonly yes --dir /data ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
          ports:
            - { name: redis, containerPort: 6379 }
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: REDIS_PASSWORD, optional: true }
            - name: REDISCLI_AUTH # read by redis-cli in the probes
              valueFrom:
                secretKeyRef: { name: {{ .secret }}, key: REDIS_PASSWORD, optional: true }
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
        {{- with .exporter }}
        {{- if .enabled }}
        # Prometheus exporter (phase 4, task 4.5): reads INFO from the redis container next to it.
        - name: exporter
          image: {{ .image }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: metrics, containerPort: 9121 }
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.redis.secret }}, key: REDIS_PASSWORD, optional: true }
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
        {{- end }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .storage }}
{{- end }}
{{- end }}

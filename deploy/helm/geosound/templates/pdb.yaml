{{- /*
Disruption budgets (deployment plan task 2.2, issue #370): an app that runs 2 or more pods
(replicas, or hpa.min) keeps at least one while a node is drained. Not for one-pod apps: a
minAvailable of 1 on a single pod would block every drain.
*/ -}}
{{- $root := . }}
{{- range $name, $raw := .Values.services }}
{{- if ne (toString (dig "enabled" true ($raw | default dict))) "false" }}
{{- $app := include "geosound.app" (dict "root" $root "app" $raw) | fromYaml }}
{{- $pods := $app.replicas }}
{{- with $app.hpa }}{{ $pods = .min }}{{ end }}
{{- if ge (int $pods) 2 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "geosound.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "geosound.selector" (dict "root" $root "name" $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}

# Let's Encrypt issuers for cert-manager (cluster runbook step 3, docs/04-guides/k3s-cluster.md).
# The chart names one in ingress.clusterIssuer. Try letsencrypt-staging first: its certificates are
# not trusted by browsers, but its rate limits are generous, so a wrong DNS record or a closed port
# 80 costs nothing. Then switch the environment to letsencrypt-prod.
# HTTP-01 challenge through Traefik: port 80 must be open and the host must point at the VM. The
# chart's NetworkPolicy acme-http01-solver lets Traefik reach the solver pod.
# No contact email: Let's Encrypt no longer sends expiry emails, and cert-manager renews by itself.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-staging-account }
    solvers:
      - http01:
          ingress: { ingressClassName: traefik }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-prod-account }
    solvers:
      - http01:
          ingress: { ingressClassName: traefik }

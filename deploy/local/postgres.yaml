# Laptop k3s only (docs/04-guides/k3s-cluster.md, "Local cluster"): a throwaway Postgres with
# pgvector in place of Supabase. No volume: the data is gone when the pod restarts, and the
# migrate Job recreates the tables on the next helm upgrade. Never use it in a real environment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels: { app: postgres }
spec:
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          env:
            - { name: POSTGRES_USER, value: test }
            - { name: POSTGRES_PASSWORD, value: test }
            - { name: POSTGRES_DB, value: geosound }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe:
            exec: { command: [pg_isready, -U, test, -d, geosound] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports: [{ name: postgres, port: 5432 }]
---
# The chart denies incoming traffic for the whole namespace: let the release's pods in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: local-postgres
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 5432, protocol: TCP }]
      from:
        - podSelector: { matchLabels: { app.kubernetes.io/instance: geosound } }

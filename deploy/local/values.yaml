# Laptop k3s only, on top of deploy/envs/staging/values.yaml (docs/04-guides/k3s-cluster.md):
#   helm upgrade --install geosound deploy/helm/geosound -n geosound-staging \
#     -f deploy/envs/staging/values.yaml -f deploy/local/values.yaml --wait --timeout 10m

# Any host, plain HTTP: there is no public DNS name and no certificate on a laptop.
ingress:
  host: ""
  clusterIssuer: ""

services:
  moderation:
    env:
      AI_SERVICE_URL: http://ai-stub:3004 # deploy/local/ai-stub.yaml, no LLM key needed
  tour:
    env:
      # UC25: MoMo cannot reach a laptop, so no IPN arrives; the return page asks MoMo for the
      # status instead. For a real IPN set MOMO_IPN_URL to a public tunnel (ngrok).
      PAYMENT_RETURN_URL: http://localhost/payment/momo
  media:
    env:
      MEDIA_PUBLIC_BASE_URL: http://localhost/api/media/files

# Prometheus scraping (phase 4, task 4.5): the laptop cluster runs kube-prometheus-stack (task 4.1).
metrics:
  serviceMonitor:
    enabled: true

redis:
  exporter:
    enabled: true

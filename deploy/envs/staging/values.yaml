# Staging (namespace geosound-staging): one replica each, smaller limits, so staging, production
# and monitoring fit on one 8 GB VM (deployment plan section 5).
#   helm upgrade --install geosound deploy/helm/geosound -n geosound-staging \
#     -f deploy/envs/staging/values.yaml

global:
  image:
    # Written on branch staging by the CI job promote after every build (task 3.2). Do not edit it
    # on develop: the develop -> staging pull request would then conflict with the bot commits.
    tag: sha-35579e0

# Staging may run without a mail server: OTP codes then go to the pod log (test accounts only).
# Without the MoMo keys (geosound-payment, UC25) Tour starts and a purchase answers 503.
optionalSecrets:
  - geosound-smtp
  - geosound-payment

# Public host (task 2.6): an A record to the VM. Let's Encrypt issues the certificate through the
# HTTP-01 challenge, so port 80 must stay open.
ingress:
  host: staging.geosound.example.com
  clusterIssuer: letsencrypt-prod

# Read-only smoke test after every Argo CD sync (task 3.3): a failure marks the sync failed.
smoke:
  enabled: true

services:
  tour:
    env:
      # UC25: MoMo sends the buyer back here and posts the IPN to the same host.
      PAYMENT_RETURN_URL: https://staging.geosound.example.com/payment/momo
  media:
    env:
      MEDIA_PUBLIC_BASE_URL: https://staging.geosound.example.com/api/media/files
  ai:
    # Memory as in the chart (#463): the embedding model load peaks at about 1.5 GiB.
    resources:
      requests: { cpu: 100m, memory: 1Gi }
      limits: { cpu: "1", memory: 2Gi }

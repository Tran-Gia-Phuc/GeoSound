# Argo CD on the laptop k3s (deployment plan section 9, docs/04-guides/k3s-cluster.md section B5).
# Values of the argo/argo-cd chart, pinned to 10.18.0 (Argo CD v3.6.1):
#   helm repo add argo https://argoproj.github.io/argo-helm
#   helm upgrade --install argocd argo/argo-cd -n argocd --version 10.18.0 \
#     -f deploy/argocd/values-local.yaml --wait
# A laptop runs it next to the whole stack, so every part is single and small.

configs:
  cm:
    # Explicit on purpose: label tracking would overwrite app.kubernetes.io/instance, which is part
    # of the immutable Deployment selectors of the geosound chart.
    application.resourceTrackingMethod: annotation
    # No GitHub webhook can reach a laptop, so Argo CD polls branch staging. The chart default
    # (120s plus up to 60s jitter) left up to 3 minutes between "Promote to staging" and the
    # sync; this keeps it under about 75s. The repo is public, so the extra polls cost nothing.
    # The controller reads both keys at start; the chart's checksum/cm annotation restarts it.
    timeout.reconciliation: 60s
    timeout.reconciliation.jitter: 15s
  params:
    # The UI is reached through a port-forward only (127.0.0.1:4467), so no TLS in the server.
    server.insecure: true

dex:
  enabled: false # one local admin account, no SSO

applicationSet:
  replicas: 0 # one hand-written Application, no generators (the chart has no enabled flag here)

# Sync results to a Discord channel (task 3.4). The Application subscribes with annotations
# (deploy/argocd/apps/geosound-staging.yaml). Each message names the app, the image tag (taken from
# the gateway image, else the short revision), the revision and a link to the app in the UI.
notifications:
  enabled: true
  argocdUrl: http://127.0.0.1:4467
  # The webhook URL is a secret: the Secret argocd-notifications-secret (key discord-webhook-url) is
  # made by hand (runbook k3s-cluster.md B5), never by the chart, never in Git (decision P3-3).
  secret:
    create: false
  notifiers:
    service.webhook.discord: |
      url: $discord-webhook-url
      headers:
        - name: Content-Type
          value: application/json
  # Go templates with the sprig functions. toJson escapes the text for the JSON body;
  # allowed_mentions stops a commit text from pinging anyone.
  templates:
    template.app-sync-succeeded: |
      webhook:
        discord:
          method: POST
          body: |
            {{- $rev := printf "%.7s" .app.status.sync.revision -}}
            {{- $tag := $rev -}}
            {{- range .app.status.summary.images -}}
              {{- if contains "/geosound-gateway:" . -}}{{- $tag = last (splitList ":" .) -}}{{- end -}}
            {{- end -}}
            {{- $text := printf "✅ **%s** synced and the smoke test passed: image `%s`, revision `%s`.\n%s/applications/argocd/%s" .app.metadata.name $tag $rev .context.argocdUrl .app.metadata.name -}}
            {"content": {{ toJson $text }}, "allowed_mentions": {"parse": []}}
    template.app-sync-failed: |
      webhook:
        discord:
          method: POST
          body: |
            {{- $rev := printf "%.7s" .app.status.sync.revision -}}
            {{- $tag := $rev -}}
            {{- range .app.status.summary.images -}}
              {{- if contains "/geosound-gateway:" . -}}{{- $tag = last (splitList ":" .) -}}{{- end -}}
            {{- end -}}
            {{- $why := .app.status.operationState.message -}}
            {{- with .app.status.operationState.syncResult -}}
              {{- range .resources -}}
                {{- if or (eq .hookPhase "Failed" "Error") (eq .status "SyncFailed") -}}
                  {{- $why = printf "%s\n%s/%s: %s" $why .kind .name .message -}}
                {{- end -}}
              {{- end -}}
            {{- end -}}
            {{- $text := printf "❌ **%s** sync failed: image `%s`, revision `%s`.\n%.900s\n%s/applications/argocd/%s" .app.metadata.name $tag $rev $why .context.argocdUrl .app.metadata.name -}}
            {"content": {{ toJson $text }}, "allowed_mentions": {"parse": []}}
    template.app-health-degraded: |
      webhook:
        discord:
          method: POST
          body: |
            {{- $text := printf "⚠️ **%s** is Degraded (revision `%.7s`): a pod or a rollout is failing.\n%s/applications/argocd/%s" .app.metadata.name .app.status.sync.revision .context.argocdUrl .app.metadata.name -}}
            {"content": {{ toJson $text }}, "allowed_mentions": {"parse": []}}
  # oncePer: one message per sync operation, even when two syncs in a row end the same way.
  triggers:
    trigger.on-sync-succeeded: |
      - description: A sync finished and every hook passed (smoke test included)
        oncePer: app.status.operationState?.startedAt
        send: [app-sync-succeeded]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded']
    trigger.on-sync-failed: |
      - description: A sync or one of its hooks failed
        oncePer: app.status.operationState?.startedAt
        send: [app-sync-failed]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: The application became Degraded
        send: [app-health-degraded]
        when: app.status.health.status == 'Degraded'
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 768Mi }

repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

redis:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 128Mi }

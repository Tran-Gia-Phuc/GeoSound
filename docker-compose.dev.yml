# =========================================================
# Override DEV: mount source để hot reload (nodemon), chạy npm run dev.
# Dùng kèm:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# =========================================================

services:
  client:
    # Hot reload: mount source, giữ node_modules trong container (anonymous volume).
    volumes:
      - ./client:/app
      - /app/node_modules

  gateway:
    command: npm run dev
    volumes:
      - ./gateway/src:/app/src
      - ./shared:/app/shared

  auth:
    command: npm run dev
    volumes:
      - ./services/auth/src:/app/src
      - ./shared:/app/shared

  tour:
    command: npm run dev
    volumes:
      - ./services/tour/src:/app/src
      - ./shared:/app/shared
      - /app/shared/node_modules # giữ deps của shared (jsonwebtoken…) đã cài trong image

  moderation:
    command: npm run dev
    volumes:
      - ./services/moderation/src:/app/src
      - ./shared:/app/shared
      - /app/shared/node_modules # giữ deps của shared (jsonwebtoken…) đã cài trong image

  media:
    command: npm run dev
    volumes:
      - ./services/media/src:/app/src
      - ./shared:/app/shared

  notification:
    command: npm run dev
    volumes:
      - ./services/notification/src:/app/src
      - ./shared:/app/shared

  ai:
    command: uvicorn app.main:app --host 0.0.0.0 --port 3004 --reload
    volumes:
      - ./services/ai/app:/app/app

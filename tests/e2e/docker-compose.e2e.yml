# Override for the moderation end-to-end test (task #AI-40, issue #181).
# Replaces the real AI service with a deterministic stub (no LLM) for Moderation, and adds a one-shot
# `e2e` runner (profile "e2e") that plays the Tour side. Paths are relative to the project directory
# (the repo root, where the first compose file lives). See docs/03-testing/moderation-e2e.md.
#
#   docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml up -d --build ai-stub moderation
#   docker compose -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml --profile e2e run --rm --build e2e

services:
  ai-stub:
    build: ./tests/e2e/ai-stub
    environment:
      PORT: 3004
      INTERNAL_SERVICE_TOKEN: e2e-internal-token
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  moderation:
    environment:
      AI_SERVICE_URL: http://ai-stub:3004
      INTERNAL_SERVICE_TOKEN: e2e-internal-token
    depends_on:
      ai-stub: { condition: service_healthy }

  # One-shot runner. Reuses the moderation image (it already has amqplib, zod and shared/).
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: services/moderation/Dockerfile
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
      E2E_AI_STUB_URL: http://ai-stub:3004
    volumes:
      - ./tests/e2e:/app/e2e:ro
    working_dir: /app
    command: ["node", "e2e/moderation-e2e.mjs"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      moderation: { condition: service_started }

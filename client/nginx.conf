# Static PWA server for the production client image (client/Dockerfile).
# /api is routed to the gateway by the Ingress, never by this server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Liveness / readiness probe: no file I/O.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # An /api request that reaches the client is misrouted: answer 404, not index.html.
    location ^~ /api/ {
        return 404;
    }

    # Hashed build output: cache for a year. A missing file is a 404, never index.html,
    # and the 404 is not cached (no `always` on Cache-Control).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Service worker and PWA entry files keep their name between builds: always revalidate,
    # so a new deploy reaches the browser (registerType autoUpdate in vite.config.js).
    location ~ ^/(sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The slim image's mime.types has no entry for .webmanifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: deep links such as /offline or /tours/:id get index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri /index.html;
    }
}

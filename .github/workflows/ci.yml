# =========================================================
# CI — chạy trên mỗi push nhánh feature/* và mỗi Pull Request vào main.
# Mục tiêu: bắt lỗi sớm mà KHÔNG cần hạ tầng (DB/Redis/RabbitMQ):
#   1) syntax-check toàn bộ JS (chưa có ESLint)
#   2) validate các Prisma schema
#   3) chạy test của các workspace có script "test" (auth: test fake in-memory)
#   4) build client (Vite) để chắc frontend còn compile
# Monorepo npm workspaces, Node 20 (khớp Dockerfile node:20-alpine).
# =========================================================
name: CI

on:
  push:
    branches: ['develop', 'staging', 'main', 'feature/**', 'ci/**']
    tags: ['v*'] # releases: tests, then the images job tags the images vX.Y.Z
  pull_request:
    branches: ['develop', 'staging', 'main']

# Cancel the older run when a new commit lands on the same feature branch or PR.
# Integration branches (develop, staging, main) and release tags never cancel: every merge
# commit gets its own result, so a red build points at the PR that broke it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/develop","refs/heads/staging","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  backend:
    name: Backend — syntax, prisma, tests
    runs-on: ubuntu-latest
    # Disposable Postgres with pgvector: shadow database of the migrations check (task 0.6, #352).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d shadow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (workspaces)
        run: npm install

      - name: Syntax check (node --check)
        run: |
          set -e
          files=$(find gateway services shared -name '*.js' -not -path '*/node_modules/*')
          for f in $files; do node --check "$f"; done
          echo "Syntax OK: $(echo "$files" | wc -l) file(s)"

      - name: Validate Prisma schemas
        # DATABASE_URL giả: prisma validate chỉ kiểm schema, KHÔNG kết nối DB,
        # nhưng cần biến env mà schema tham chiếu phải tồn tại.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: |
          set -e
          for schema in services/*/prisma/schema.prisma; do
            echo "prisma validate -> $schema"
            npx prisma validate --schema "$schema"
          done

      - name: Prisma migrations match schema.prisma
        # Replays prisma/migrations of every service on the shadow Postgres above and diffs the
        # result with schema.prisma: a schema change without a migration fails here (task 0.6).
        env:
          SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/shadow
        run: sh scripts/db/check-migrations.sh

      - name: Run workspace tests
        run: npm test --workspaces --if-present

  client:
    name: Client — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (workspaces)
        run: npm install

      - name: Build client (Vite)
        run: npm run build --workspace client

  browser:
    name: Client — browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:ui --workspace client

  # Deployment plan phase 1 (#363): production images, only after every test job passed.
  # Pull requests build the changed images without pushing; develop, staging, main and v* tags
  # publish them to GHCR. Feature branch pushes skip it (their pull request builds them).
  images:
    name: Images
    needs: [backend, client, browser]
    if: >-
      github.event_name == 'pull_request' ||
      contains(fromJSON('["refs/heads/develop","refs/heads/staging","refs/heads/main"]'), github.ref) ||
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      push: ${{ github.event_name == 'push' }}
